<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Institucional - Repositorio FCA</title>
    <link rel="icon" href="/static/images/LOGO FCA2.png" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #006633;
            --secondary-color: #ffd700;
        }
        body {
            background-color: #f4f6f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }
        .login-card {
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 440px;
            overflow: hidden;
            background-color: #fff;
        }
        .login-header {
            background-color: var(--primary-color);
            color: #fff;
            text-align: center;
            padding: 2rem 1.5rem;
        }
        .btn-uabc {
            background-color: var(--primary-color);
            color: #fff;
            border-radius: 25px;
            font-weight: 700;
            transition: background-color 0.3s ease;
        }
        .btn-uabc:hover {
            background-color: #004d26;
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-header">
            <i class="fas fa-user-circle fa-4x mb-2"></i>
            <h4 class="mb-0">Portal Administrativo</h4>
            <small>Repositorio Institucional FCA</small>
        </div>
        <div class="card-body p-4">
            {% if messages %}
                {% for m in messages %}
                    <div class="alert alert-{{ m.tags }} py-2">{{ m }}</div>
                {% endfor %}
            {% endif %}

            {% if form.errors %}
                <div class="alert alert-danger py-2">
                    <i class="fas fa-exclamation-triangle me-1"></i> Usuario o contraseña incorrectos.
                </div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-bold"><i class="fas fa-user me-2 text-muted"></i>Usuario</label>
                    <input type="text" name="username" class="form-control" placeholder="Ingrese su usuario" required autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-bold"><i class="fas fa-lock me-2 text-muted"></i>Contraseña</label>
                    <input type="password" name="password" class="form-control" placeholder="Ingrese su contraseña" required>
                </div>
                <button type="submit" class="btn btn-uabc w-100 py-2 mt-2">Iniciar Sesión</button>
            </form>

            <div class="text-center mt-3 pt-3 border-top">
                <a href="{% url 'solicitar_registro' %}" class="small text-decoration-none fw-bold text-success d-block mb-2">
                    <i class="fas fa-user-plus me-1"></i>¿Docente o Administrativo? Solicita tu cuenta aquí
                </a>
                <a href="/" class="text-muted small text-decoration-none">
                    <i class="fas fa-arrow-left me-1"></i>Volver al catálogo
                </a>
            </div>
        </div>
    </div>
</body>
</html>
